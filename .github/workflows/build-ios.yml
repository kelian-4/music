# Builds the unsigned iOS IPA only (no Mac DMG, no release, no appcast), as a
# workflow artifact to install with SideStore.
#
# macOS minutes are the expensive ones, so a push builds only when its commit
# message contains [build]; a manual run from the Actions tab always builds.
name: Build iOS (unsigned IPA)

on:
  push:
    branches: ['feat/**', 'ci/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    # Xcode 27 image, generally available since October 2026.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)"
          [[ -n "$xcode" ]] || { echo "::error::This runner image has no Xcode 27"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-darwin aarch64-apple-ios
          brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.cargo/registry
            ~/.cargo/git
            native-core/target
          key: build-${{ runner.os }}-${{ hashFiles('native-core/Cargo.lock', '*.gradle.kts', 'shared/*.gradle.kts','gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: build-${{ runner.os }}-

      - name: Build the unsigned IPA
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' AppleApp/project.yml | head -1)"
          # The host slice is needed by the UniFFI bindgen step.
          NATIVE_TARGETS="aarch64-apple-darwin aarch64-apple-ios" scripts/build-native-core.sh
          CONFIG=release scripts/build-shared-framework.sh
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" AppleApp/project.yml
          (cd AppleApp && xcodegen generate --spec project.yml)
          AMBER_BUILD_REVISION="$(git rev-parse --short=12 HEAD)" \
            scripts/package-ios-ipa.sh "$version" --output-dir build/ipa --overwrite

      - uses: actions/upload-artifact@v4
        with:
          name: amber-ios-unsigned-ipa
          path: build/ipa/*.ipa
          retention-days: 14

      - name: Publish to the SideStore source
        if: github.ref == 'refs/heads/feat/ios-amber' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ipa="$(ls build/ipa/*.ipa | head -1)"
          cp "$ipa" build/Amber.ipa
          version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' AppleApp/project.yml | head -1)"
          build="$(basename "$ipa" | sed -n 's/.*-build\([0-9]*\)-.*/\1/p')"
          size="$(stat -f%z build/Amber.ipa)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha="$(git rev-parse --short=12 HEAD)"
          python3 - "$version" "$size" "$date" "$sha" "$build" "$REPO" "${GITHUB_REF_NAME}" <<'PY'
          import json, sys
          version, size, date, sha, run, repo, ref = sys.argv[1:8]
          base = f"https://github.com/{repo}/releases/download/ios-nightly"
          source = {
              "name": "Amber",
              "identifier": "app.amber.source",
              "subtitle": "Amber, direct from the repository",
              "description": "Builds of Amber for iOS, published automatically from the repository.",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/{ref}/AppleApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "website": f"https://github.com/{repo}",
              "tintColor": "#FF9F0A",
              "apps": [{
                  "name": "Amber",
                  "bundleIdentifier": "app.amber.Amber",
                  "developerName": "Kelian",
                  "subtitle": "Music player for YouTube Music",
                  "localizedDescription": "Amber is a music player for iOS built on YouTube Music.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/{ref}/AppleApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
                  "tintColor": "#FF9F0A",
                  "category": "entertainment",
                  "screenshotURLs": [],
                  "versions": [{
                      "version": version,
                      "buildVersion": run,
                      "date": date,
                      "localizedDescription": f"Build {run} ({sha})",
                      "downloadURL": f"{base}/Amber.ipa",
                      "size": int(size),
                      "minOSVersion": "18.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          json.dump(source, open("build/source.json", "w"), indent=2)
          PY
          gh release view ios-nightly --repo "$REPO" >/dev/null 2>&1 || \
            gh release create ios-nightly --repo "$REPO" --prerelease --title "Amber (iOS, latest build)" \
              --notes "Rolling build installed through the SideStore source. Source URL: https://github.com/$REPO/releases/download/ios-nightly/source.json"
          gh release upload ios-nightly build/Amber.ipa build/source.json --repo "$REPO" --clobber
