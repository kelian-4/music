name: Build Android (dev debug)

on:
  push:
    branches: ['feat/**', 'ci/**']
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Build minutes are a monthly budget: a push builds only when its commit
    # message asks for it with [build]; a manual run always builds.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Empty keys are fine: the optional integrations (Last.fm, Listen Together)
      # simply stay off in a fork build without secrets.
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - run: chmod +x gradlew

      # One Gradle run, :app only (the --tests filter would fail in modules
      # that have no such test). Each feature lists its own unit tests in
      # .github/fork-tests.d/<feature>.txt (one file per feature, so branches
      # merge without conflicts); they gate the APK. With none listed, only the
      # APK is built: upstream's full suite has known failures of its own.
      - name: Fork feature tests, then build the dev debug APK
        run: |
          args=""
          for f in .github/fork-tests.d/*.txt; do
            [ -f "$f" ] || continue
            while read -r c; do
              [ -n "$c" ] && args="$args --tests $c"
            done < "$f"
          done
          if [ -n "$args" ]; then
            ./gradlew :app:testDevDebugUnitTest $args :app:assembleDevDebug -PamberAbi=arm64-v8a,x86_64 --stacktrace
          else
            ./gradlew :app:assembleDevDebug -PamberAbi=arm64-v8a,x86_64 --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/*.html
